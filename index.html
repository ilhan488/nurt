<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Nurelyyana ♡</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#08080d;color:#fff}
body{overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:0;background:center/cover no-repeat url("photo1.jpeg");filter:blur(24px) brightness(.38) saturate(.9);transform:scale(1.12);transition:background-image .45s ease}
.shade{position:fixed;inset:0;z-index:1;background:linear-gradient(180deg,rgba(0,0,0,.68),rgba(0,0,0,.18) 45%,rgba(0,0,0,.72))}
.page{position:relative;z-index:2;min-height:100vh;padding:18px 14px 28px}
.topbar{max-width:900px;margin:auto;display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid rgba(255,255,255,.15);background:rgba(15,15,22,.55);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:18px}
.disc{width:42px;height:42px;border-radius:50%;flex:0 0 42px;background:radial-gradient(circle,#fff 0 7%,#f1a9c4 8% 18%,#28232c 19% 32%,#f1a9c4 33% 37%,#111 38%);box-shadow:0 0 0 2px rgba(255,255,255,.1)}
.track{min-width:105px;display:flex;flex-direction:column;font-size:13px;line-height:1.15}
.track b{font-size:14px}.track span{opacity:.58;font-size:11px;margin-top:3px}
.progress{height:3px;flex:1;min-width:40px;background:rgba(255,255,255,.18);border-radius:10px;overflow:hidden}
.progress i{display:block;width:0;height:100%;background:#f6b5cf}
.play{width:40px;height:40px;border:0;border-radius:50%;background:#f6b5cf;color:#17131a;font-size:15px;cursor:pointer;touch-action:manipulation}
.clock{font-size:12px;opacity:.6;white-space:nowrap}
.title{text-align:center;margin:28px 0 12px;font-size:18px;letter-spacing:2px;color:#f7c9dc}
.hero{max-width:900px;margin:auto;display:flex;align-items:center;justify-content:center;gap:10px}
.frame{width:min(76vw,430px);height:min(72vh,650px);border-radius:24px;overflow:hidden;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);box-shadow:0 24px 70px rgba(0,0,0,.45)}
.frame img{width:100%;height:100%;display:block;object-fit:cover;transition:opacity .16s ease}
.arrow{width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(15,15,22,.55);color:#fff;font-size:34px;line-height:1;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.arrow:active,.play:active{transform:scale(.94)}
.counter{text-align:center;margin-top:10px;font-size:12px;opacity:.7}
.thumbs{max-width:900px;margin:16px auto 0;display:flex;gap:8px;overflow-x:auto;padding:3px 2px 8px;scrollbar-width:none}
.thumbs::-webkit-scrollbar{display:none}
.thumb{flex:0 0 64px;height:64px;border-radius:12px;overflow:hidden;border:2px solid transparent;opacity:.68;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.thumb.active{border-color:#f6b5cf;opacity:1}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
#startOverlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(5,5,9,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:opacity .3s,visibility .3s}
#startOverlay.hidden{opacity:0;visibility:hidden;pointer-events:none}
.startCard{text-align:center;padding:28px 34px;border:1px solid rgba(255,255,255,.16);border-radius:24px;background:rgba(255,255,255,.08)}
.startCard .icon{font-size:36px;margin-bottom:8px}.startCard .txt{font-size:16px}.startCard .sub{font-size:12px;opacity:.6;margin-top:7px}
@media(max-width:520px){
 .topbar{gap:7px;padding:8px}.clock{display:none}
 .frame{width:78vw;height:68vh}
 .arrow{width:43px;height:43px;font-size:30px}
}
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<div class="shade"></div>

<div id="startOverlay">
  <div class="startCard">
    <div class="icon">▶</div>
    <div class="txt">Tap to start ♡</div>
    <div class="sub">music will start after you tap</div>
  </div>
</div>

<main class="page">
  <div class="topbar">
    <div class="disc"></div>
    <div class="track"><b>Cinderella</b><span>Ty Dolla $ign</span></div>
    <div class="progress"><i id="progress"></i></div>
    <button class="play" id="playBtn" type="button" aria-label="Play or pause music">▶</button>
    <div class="clock" id="clock"></div>
  </div>

  <div class="title">Nurelyyana ♡</div>

  <div class="hero">
    <button class="arrow" id="prev" type="button" aria-label="Previous photo">‹</button>
    <div>
      <div class="frame"><img id="mainPhoto" src="photo1.jpeg" alt="Photo 1"></div>
      <div class="counter"><span id="count">1</span> / 7</div>
    </div>
    <button class="arrow" id="next" type="button" aria-label="Next photo">›</button>
  </div>

  <div class="thumbs" id="thumbs"></div>
</main>

<audio id="music" src="cinderella.mp3" preload="auto" loop></audio>

<script>
(() => {
  const photos = Array.from({length:7}, (_,i) => `photo${i+1}.jpeg`);
  let current = 0;
  let slideTimer = null;

  const main = document.getElementById('mainPhoto');
  const bg = document.getElementById('bg');
  const count = document.getElementById('count');
  const thumbs = document.getElementById('thumbs');
  const music = document.getElementById('music');
  const playBtn = document.getElementById('playBtn');
  const progress = document.getElementById('progress');
  const overlay = document.getElementById('startOverlay');

  photos.forEach((src, i) => {
    const d = document.createElement('button');
    d.type = 'button';
    d.className = 'thumb' + (i === 0 ? ' active' : '');
    d.setAttribute('aria-label', `Photo ${i+1}`);
    d.innerHTML = `<img src="${src}" alt="Photo ${i+1}">`;
    d.addEventListener('click', () => show(i, true));
    thumbs.appendChild(d);
  });

  function show(i, userAction=false) {
    current = (i + photos.length) % photos.length;
    main.style.opacity = '0';
    setTimeout(() => {
      main.src = photos[current];
      bg.style.backgroundImage = `url("${photos[current]}")`;
      main.style.opacity = '1';
    }, 100);
    count.textContent = current + 1;
    [...thumbs.children].forEach((x,n) => x.classList.toggle('active', n === current));
    if (userAction) {
      const active = thumbs.children[current];
      if (active) active.scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'});
    }
  }

  document.getElementById('prev').addEventListener('click', () => show(current - 1, true));
  document.getElementById('next').addEventListener('click', () => show(current + 1, true));

  // Reliable 1-second slideshow.
  slideTimer = setInterval(() => show(current + 1), 1000);

  function updatePlayButton() {
    playBtn.textContent = music.paused ? '▶' : '❚❚';
  }

  async function startMusic() {
    try {
      await music.play();
      updatePlayButton();
      overlay.classList.add('hidden');
    } catch (e) {
      updatePlayButton();
    }
  }

  // Attempt autoplay where the browser allows it.
  window.addEventListener('load', () => {
    music.play().then(() => {
      updatePlayButton();
      overlay.classList.add('hidden');
    }).catch(() => updatePlayButton());
  });

  // iPhone requires a user gesture for audible playback.
  overlay.addEventListener('click', startMusic);
  overlay.addEventListener('touchend', startMusic, {passive:true});
  playBtn.addEventListener('click', async () => {
    if (music.paused) await startMusic();
    else { music.pause(); updatePlayButton(); }
  });

  music.addEventListener('timeupdate', () => {
    if (music.duration) progress.style.width = `${(music.currentTime / music.duration) * 100}%`;
  });
  music.addEventListener('ended', updatePlayButton);

  function clock() {
    const d = new Date();
    document.getElementById('clock').textContent =
      d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
  }
  clock();
  setInterval(clock, 1000);
})();
</script>
</body>
</html>
